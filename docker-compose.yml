services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db
      - redis
    expose:
      - "9000"
    volumes:
      - storage_data:/app/storage
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.services.curso-filament.loadbalancer.server.port=8080
      - traefik.http.routers.curso-filament.rule=Host(`${APP_DOMAIN:-localhost}`)
      - traefik.http.routers.curso-filament.entrypoints=web
      - traefik.http.routers.curso-filament-secure.rule=Host(`${APP_DOMAIN:-localhost}`)
      - traefik.http.routers.curso-filament-secure.entrypoints=websecure
      - traefik.http.routers.curso-filament-secure.tls=true
    networks:
      - dokploy-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["php","artisan","queue:work","--tries=3","--timeout=120","--sleep=1"]
    depends_on:
      - db
      - redis
    volumes:
      - storage_data:/app/storage
    networks:
      - dokploy-network

  redis:
    image: redis:7-alpine
    networks:
      - dokploy-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - dokploy-network

volumes:
  db_data:
  storage_data:

networks:
  dokploy-network:
    external: true
    name: dokploy-network