services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db
      - redis
    expose:
      - "80"
    volumes:
      - laravel_uploads:/app/storage/app/public
      - laravel_logs:/app/storage/logs
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # HTTP
      - traefik.http.routers.filament.rule=Host(${APP_DOMAIN})
      - traefik.http.routers.filament.entrypoints=web
      - traefik.http.services.filament.loadbalancer.server.port=80

      # HTTPS
      - traefik.http.routers.filament-secure.rule=Host(${APP_DOMAIN})
      - traefik.http.routers.filament-secure.entrypoints=websecure
      - traefik.http.routers.filament-secure.tls=true
      - traefik.http.routers.filament-secure.service=filament
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      web:
        condition: service_healthy
    command: ["php", "artisan", "horizon"]
    volumes:
      - laravel_uploads:/app/storage/app/public
      - laravel_logs:/app/storage/logs
    networks:
      - dokploy-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      web:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - laravel_uploads:/app/storage/app/public
      - laravel_logs:/app/storage/logs
    networks:
      - dokploy-network

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - dokploy-network

volumes:
  mysql_data:
  laravel_uploads:
  laravel_logs:

networks:
  dokploy-network:
    external: true
    name: dokploy-network