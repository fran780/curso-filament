services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    depends_on:
      - db
      - redis
    command:
      - sh
      - -lc
      - php artisan octane:start --server=frankenphp --host=0.0.0.0 --port=8080
    volumes:
      - storage_data:/app/storage
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    command: ["php","artisan","queue:work","--tries=3","--timeout=120","--sleep=1"]
    depends_on:
      web:
        condition: service_healthy
      db:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - storage_data:/app/storage
    networks:
      - default

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - default

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-app}
      MYSQL_USER: ${DB_USERNAME:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - default

volumes:
  db_data:
  storage_data:

networks:
  dokploy-network:
    external: true
    name: dokploy-network