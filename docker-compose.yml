services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db
    expose:
      - "8080"
    volumes:
      - storage_data:/var/www/html/storage
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.curso-filament.rule=Host(${APP_DOMAIN:-143.110.237.241})
      - traefik.http.routers.curso-filament.entrypoints=web
      - traefik.http.services.curso-filament.loadbalancer.server.port=8080
    networks:
      - dokploy-network

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dokploy-network

volumes:
  mysql_data:
  storage_data:

networks:
  dokploy-network:
    external: true